<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1423" />
    <meta
      name="description"
      content="A four-year Bachelor of Music curriculum with weekly lessons, adapted from leading conservatories."
    />
    <title>Music University — Bachelor of Music Curriculum</title>
    <script>
      // Resolve the theme before first paint, otherwise a stored light
      // preference flashes the dark default on every load.
      ;(function () {
        try {
          var stored = localStorage.getItem('music-university-theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = resolved
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
